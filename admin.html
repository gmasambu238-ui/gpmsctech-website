<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - @speed_awr360°</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:20px}
h1{color:#0b3d91;text-align:center}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}
button{background:#0b3d91;color:#fff;border:none;padding:8px 15px;border-radius:5px;cursor:pointer}
button.del{background:#d00}
#lock{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}
#lockBox{background:#111;border:2px solid #00ff88;border-radius:15px;padding:20px;max-width:400px;width:100%;text-align:center;color:#fff}
#lockBox input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}
#lockBox button{width:100%;padding:12px;background:#00ff88;color:#000;font-weight:bold;border:none;border-radius:8px}
#adminPanel{display:none}
</style>
</head>
<body>

<div id="lock">
  <div id="lockBox">
    <h2>@speed_awr360°</h2>
    <p>MFUMO UMEFUNGWA - MHUSIKA TU</p>
    <input id="secEmail" type="email" placeholder="1. Email ya Mhusika">
    <input id="secPass" type="password" placeholder="2. Password">
    <input id="sec2FA" placeholder="3. 2FA - 6 tarakimu">
    <input id="secQR" placeholder="4. QR CODE - 1 hadi 12">
    <button onclick="fungua()">INGIA</button>
    <p id="secMsg" style="color:#ff4444"></p>
  </div>
</div>

<div id="adminPanel">
<h1>GPMSCTECH - Admin Panel</h1>
<p style="text-align:center" id="status">Inapakia oda...</p>
<div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const ALLOWED_EMAILS = ["gmasambu238@gmail.com","georgemasambu64@gmail.com"];
let QR_CODES = {"1":false,"2":false,"3":false,"4":false,"5":false,"6":false,"7":false,"8":false,"9":false,"10":false,"11":false,"12":false};
let used = JSON.parse(localStorage.getItem("used_qr_speed_awr360") || "[]");
used.forEach(c => { if(QR_CODES[c] !== undefined) QR_CODES[c] = true; });

function fungua(){
  let email = document.getElementById("secEmail").value.trim().toLowerCase();
  let pass = document.getElementById("secPass").value.trim();
  let twoFA = document.getElementById("sec2FA").value.trim();
  let qr = document.getElementById("secQR").value.trim();
  let msg = document.getElementById("secMsg");
  if(!ALLOWED_EMAILS.includes(email)){ msg.innerText = "KATALIWA: Email hii hairuhusiwi."; return; }
  if(pass.length < 6){ msg.innerText = "KATALIWA: Password si sahihi."; return; }
  if(twoFA.length !== 6){ msg.innerText = "KATALIWA: Ingiza 2FA 6 tarakimu."; return; }
  if(QR_CODES[qr] === undefined){ msg.innerText = "KATALIWA: QR lazima iwe 1 hadi 12."; return; }
  if(QR_CODES[qr] === true){ msg.innerText = "KATALIWA: Namba " + qr + " imeshatumika. Tumia nyingine."; return; }
  QR_CODES[qr] = true;
  used.push(qr);
  localStorage.setItem("used_qr_speed_awr360", JSON.stringify(used));
  document.getElementById("lock").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";
  loadOda();
}

const firebaseConfig = {
  apiKey: "AIzaSyBYmWzzWfvHkuRgHpQhvDzj6m0o8oRzHrw",
  authDomain: "gpmsctech-18abb.firebaseapp.com",
  projectId: "gpmsctech-18abb",
  storageBucket: "gpmsctech-18abb.firebasestorage.app",
  messagingSenderId: "554624850081",
  appId: "1:554624850081:web:ac5884fdd893a540ed78e0",
  measurementId: "G-G1CX44BC95"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function loadOda(){
  db.collection("orders").orderBy("createdAt","desc").onSnapshot((snap)=>{
    const list = document.getElementById("list");
    document.getElementById("status").innerText = "Oda zilizopatikana: " + snap.size;
    list.innerHTML = "";
    if(snap.empty){ list.innerHTML = "<p>Hakuna oda bado.</p>"; return; }
    snap.forEach((doc)=>{
      const d = doc.data();
      list.innerHTML += `<div class="card">
        <b>${d.name || d.jina || 'Mteja'}</b> - ${d.phone || d.sim || ''}<br>
        Email: ${d.email || ''}<br>
        Huduma: ${d.service || d.huduma || ''}<br>
        Ujumbe: ${d.message || d.ujumbe || ''}<br>
        <small>${d.createdAt ? d.createdAt.toDate() : ''}</small><br><br>
        <button class="del" onclick="futa('${doc.id}')">Futa</button>
      </div>`;
    });
  }, (err)=>{
    document.getElementById("status").innerText = "Error: " + err.message;
  });
}
function futa(id){
  if(confirm("Futa hii oda?")){ db.collection("orders").doc(id).delete(); }
}
</script>
</body>
</html>
