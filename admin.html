<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPMSCTECH - Admin</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#1e293b;padding:25px;border-radius:15px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h2{text-align:center;color:#22c55e;margin:0 0 5px} p{text-align:center;color:#94a3b8;font-size:13px}
.pay{background:#422006;border:1px solid #f59e0b;padding:10px;border-radius:8px;text-align:center;font-size:13px;margin-top:12px;color:#fde68a}
label{display:block;margin-top:15px;font-size:13px;color:#cbd5e1}
input{width:100%;padding:12px;margin-top:5px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#fff;box-sizing:border-box;font-size:16px}
button{width:100%;padding:13px;margin-top:20px;background:#22c55e;color:#000;font-weight:900;border:0;border-radius:8px;font-size:16px;cursor:pointer}
button:active{transform:scale(.98)}
#msg{text-align:center;margin-top:12px;font-size:13px;color:#f87171;min-height:18px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="box">
<h2>GPMSCTECH</h2>
<p>Admin Panel - Ulinzi wa Kudumu</p>
<div class="pay">🔒 MFUMO UMEFUNGWA<br> LIPIA KWANZA NDIO UTUMIE</div>

<label>Email Address</label>
<input id="email" type="email" placeholder="Email yako" value="georgemasambu64@gmail.com">

<label>Password</label>
<input id="pass" type="password" placeholder="Password yako">

<label>2FA - Security Code</label>
<input id="fa" type="text" inputmode="numeric" maxlength="6" placeholder="2FA - 6 tarakimu">

<label>CODE YA MALIPO - Lazima Ulipie Kwanza</label>
<input id="pay" type="text" placeholder="Weka CODE uliyopewa baada ya kulipia">

<button onclick="login()">INGIA</button>
<div id="msg"></div>

<!-- QR SECURITY CODES - ZIMEFICHWA, ZISIONEKANE, LAKINI MFUMO UNAZITUMIA -->
<div class="hidden" id="qr-layer">
  <span data-qr="speed_awr360-1">@speed_awr360°-QR-1-A9X7</span>
  <span data-qr="speed_awr360-2">@speed_awr360°-QR-2-K4M2</span>
  <span data-qr="speed_awr360-3">@speed_awr360°-QR-3-Z8P1</span>
</div>

</div>

<script>
// ===== MFUMO WA ULINZI - HAUBADILIKI KAMWE =====
const HIDDEN_QR = ["@speed_awr360°-QR-1-A9X7","@speed_awr360°-QR-2-K4M2","@speed_awr360°-QR-3-Z8P1"];
const SPEED_TAG = "@speed_awr360°";

// ===== VIGEZO 3 VYA ADMIN - VYA KUDUMU, HAVIBADILIKI KAMWE =====
const ADMIN_EMAIL = "georgemasambu64@gmail.com";
const ADMIN_PASS = "GPMSCTECH@2026";
const ADMIN_2FA = "123456";

// ===== KIFULI CHA MALIPO - BILA HII HAKUNA KUINGIA =====
// BADILISHA HAPA TU: Weka CODE yako ya malipo ya kudumu unayowapa waliolipia
const PAID_CODE = "GPMSC-PAID-2026";

function login(){
  const e = document.getElementById('email').value.trim();
  const p = document.getElementById('pass').value;
  const f = document.getElementById('fa').value.trim();
  const pay = document.getElementById('pay').value.trim();
  const msg = document.getElementById('msg');

  if(!HIDDEN_QR || HIDDEN_QR.length !== 3 || !HIDDEN_QR[0].includes(SPEED_TAG)){
    msg.textContent = "Mfumo umezuiwa: Ulinzi umekosekana.";
    return;
  }
  // 1. HAKIKI MALIPO KWANZA - KABLA YA YOTE
  if(pay !== PAID_CODE){ msg.textContent = "Hujalipia! Lipa kwanza ndio upate CODE YA MALIPO."; return; }
  if(e !== ADMIN_EMAIL){ msg.textContent = "Email si sahihi."; return; }
  if(p !== ADMIN_PASS){ msg.textContent = "Password si sahihi."; return; }
  if(f !== ADMIN_2FA){ msg.textContent = "2FA si sahihi."; return; }

  msg.style.color = "#22c55e";
  msg.textContent = "Karibu Mkuu! Malipo yamethibitishwa, Unaingia...";
  localStorage.setItem("gpmsc_admin","yes");
  localStorage.setItem("gpmsc_paid","yes");
  setTimeout(()=>{ window.location.href = "index.html"; }, 800);
}
</script>
</body>
</html>
