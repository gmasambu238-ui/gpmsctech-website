<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPMSCTECH - Admin</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#1e293b;padding:25px;border-radius:15px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h2{text-align:center;color:#22c55e;margin:0 0 5px} p{text-align:center;color:#94a3b8;font-size:13px}
label{display:block;margin-top:15px;font-size:13px;color:#cbd5e1}
input{width:100%;padding:12px;margin-top:5px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#fff;box-sizing:border-box;font-size:16px}
button{width:100%;padding:13px;margin-top:20px;background:#22c55e;color:#000;font-weight:900;border:0;border-radius:8px;font-size:16px;cursor:pointer}
#msg{text-align:center;margin-top:12px;font-size:13px;color:#f87171;min-height:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="box">
<h2>GPMSCTECH</h2>
<p>Admin Panel</p>
<label>1. Email Address</label>
<input id="email" type="email" value="georgemasambu64@gmail.com">
<label>2. Password</label>
<input id="pass" type="password" placeholder="Password yako">
<label>3. 2FA - 6 tarakimu</label>
<input id="fa" type="text" inputmode="numeric" maxlength="6" placeholder="2FA - 6 tarakimu">
<button onclick="login()">INGIA</button>
<div id="msg"></div>
<div class="hidden"><span>34796</span><span>38065</span><span>54407</span><span>19521</span><span>10096</span><span>78967</span><span>56067</span><span>58527</span><span>74622</span><span>37300</span><span>41573</span><span>90845</span></div>
</div>
<script>
const HIDDEN_CODES = ["34796","38065","54407","19521","10096","78967","56067","58527","74622","37300","41573","90845"];
const ADMIN_EMAIL = "georgemasambu64@gmail.com";
const ADMIN_PASS = "GPMSCTECH@2026";
const ADMIN_2FA = "123456";
function login(){
  const e = document.getElementById('email').value.trim();
  const p = document.getElementById('pass').value;
  const f = document.getElementById('fa').value.trim();
  const msg = document.getElementById('msg');
  if(!HIDDEN_CODES || HIDDEN_CODES.length !== 12){ msg.textContent = "Mfumo umezuiwa."; return; }
  if(e !== ADMIN_EMAIL){ msg.textContent = "Email si sahihi."; return; }
  if(p !== ADMIN_PASS){ msg.textContent = "Password si sahihi."; return; }
  if(f !== ADMIN_2FA){ msg.textContent = "2FA si sahihi."; return; }
  msg.style.color = "#22c55e";
  msg.textContent = "Karibu Mkuu! Unaingia...";
  localStorage.setItem("gpmsc_admin","yes");
  setTimeout(()=>{ window.location.href = "index.html"; }, 800);
}
</script>
</body>
</html>
