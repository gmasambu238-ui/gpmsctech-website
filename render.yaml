services:
  - type: web
    name: server-001
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js

    envVars:
      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      - key: VERIFICATION_EMAIL
        sync: false

      - key: SECOND_EMAIL
        sync: false
